<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ApexTrade — Live Analytics</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: #0a0a0a;
        color: #fff;
        font-family: "Segoe UI", system-ui, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 2rem 1rem;
      }
      .dashboard {
        width: 100%;
        max-width: 600px;
      }
      .counter-box {
        text-align: center;
        padding: 3rem 2rem;
        border: 2px solid #00d4aa;
        border-radius: 20px;
        background: rgba(0, 212, 170, 0.05);
        margin-bottom: 1.5rem;
        position: relative;
      }
      .live-dot {
        display: inline-block;
        width: 12px;
        height: 12px;
        background: #ff4444;
        border-radius: 50%;
        margin-right: 8px;
        animation: pulse 1.5s infinite;
      }
      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
          transform: scale(1);
        }
        50% {
          opacity: 0.5;
          transform: scale(1.2);
        }
      }
      .count {
        font-size: 5rem;
        font-weight: 900;
        color: #00d4aa;
        margin: 0.5rem 0;
        text-shadow: 0 0 30px rgba(0, 212, 170, 0.3);
      }
      .label {
        font-size: 1.1rem;
        color: #888;
        text-transform: uppercase;
        letter-spacing: 3px;
      }
      .timestamp {
        margin-top: 1.5rem;
        font-size: 0.9rem;
        color: #666;
      }

      /* Stats Grid */
      .stats-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 1rem;
        margin-bottom: 1.5rem;
      }
      .stat-card {
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 14px;
        padding: 1.2rem;
        text-align: center;
        transition: border-color 0.3s;
      }
      .stat-card:hover {
        border-color: rgba(0, 212, 170, 0.3);
      }
      .stat-value {
        font-size: 2rem;
        font-weight: 800;
        color: #00d4aa;
        margin-bottom: 0.3rem;
      }
      .stat-label {
        font-size: 0.8rem;
        color: #777;
        text-transform: uppercase;
        letter-spacing: 1.5px;
      }

      /* Reset Button */
      .reset-bar {
        display: flex;
        gap: 1rem;
        justify-content: center;
        flex-wrap: wrap;
      }
      .btn {
        padding: 0.8rem 1.6rem;
        border-radius: 10px;
        border: none;
        font-size: 0.9rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s;
        text-transform: uppercase;
        letter-spacing: 1px;
      }
      .btn-reset {
        background: rgba(255, 68, 68, 0.1);
        color: #ff4444;
        border: 1px solid rgba(255, 68, 68, 0.3);
      }
      .btn-reset:hover {
        background: rgba(255, 68, 68, 0.2);
      }
      .btn-refresh {
        background: rgba(0, 212, 170, 0.1);
        color: #00d4aa;
        border: 1px solid rgba(0, 212, 170, 0.3);
      }
      .btn-refresh:hover {
        background: rgba(0, 212, 170, 0.2);
      }

      /* Toast */
      .toast {
        position: fixed;
        top: 20px;
        right: 20px;
        background: #00d4aa;
        color: #000;
        padding: 1rem 1.5rem;
        border-radius: 10px;
        font-weight: 600;
        transform: translateX(150%);
        transition: transform 0.3s ease;
        z-index: 9999;
      }
      .toast.show {
        transform: translateX(0);
      }

      @media (max-width: 480px) {
        .count {
          font-size: 3.5rem;
        }
        .stats-grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
  </head>
  <body>
    <div class="dashboard">
      <!-- Live Counter -->
      <div class="counter-box">
        <div class="label"><span class="live-dot"></span>Currently Viewing</div>
        <div class="count" id="viewerCount">0</div>
        <div class="label">ApexTrade AI</div>
        <div class="timestamp" id="lastUpdate">Waiting for data...</div>
      </div>

      <!-- Time Period Stats -->
      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-value" id="stat5min">0</div>
          <div class="stat-label">Last 5 Minutes</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="stat30min">0</div>
          <div class="stat-label">Last 30 Minutes</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="stat1hr">0</div>
          <div class="stat-label">Last 1 Hour</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="statToday">0</div>
          <div class="stat-label">Today</div>
        </div>
      </div>

      <!-- Controls -->
      <div class="reset-bar">
        <button class="btn btn-refresh" onclick="refreshStats()">
          Refresh Stats
        </button>
        <button class="btn btn-reset" onclick="resetData()">
          Reset All Data
        </button>
      </div>
    </div>

    <!-- Toast Notification -->
    <div class="toast" id="toast">Action completed</div>

    <script>
      const firebaseConfig = {
        apiKey: "AIzaSyCZfgAyItxawS3FzjsjZDzJ-CKqDbWFCX4",
        authDomain: "eventra-5b375.firebaseapp.com",
        databaseURL: "https://eventra-5b375-default-rtdb.firebaseio.com",
        projectId: "eventra-5b375",
        storageBucket: "eventra-5b375.firebasestorage.app",
        messagingSenderId: "53804447008",
        appId: "1:53804447008:web:1576624a1a5cd1d2a85345",
      };

      firebase.initializeApp(firebaseConfig);
      const db = firebase.database();

      const countEl = document.getElementById("viewerCount");
      const timeEl = document.getElementById("lastUpdate");
      const toastEl = document.getElementById("toast");

      function showToast(msg) {
        toastEl.textContent = msg;
        toastEl.classList.add("show");
        setTimeout(() => toastEl.classList.remove("show"), 2500);
      }

      function formatDateTime(date) {
        return date.toLocaleString("en-US", {
          weekday: "short",
          year: "numeric",
          month: "short",
          day: "numeric",
          hour: "2-digit",
          minute: "2-digit",
          second: "2-digit",
          hour12: true,
        });
      }

      function updateStats() {
        const now = Date.now();

        // Live viewers
        db.ref("viewers").once("value", (snap) => {
          const liveCount = snap.numChildren();
          countEl.textContent = liveCount;
          timeEl.textContent = `Last updated: ${formatDateTime(new Date())}`;
        });

        // Visit stats by time period
        db.ref("visits").once("value", (snap) => {
          const visits = snap.val() || {};
          const visitList = Object.values(visits);

          const fiveMinAgo = now - 5 * 60 * 1000;
          const thirtyMinAgo = now - 30 * 60 * 1000;
          const oneHrAgo = now - 60 * 60 * 1000;
          const todayStart = new Date();
          todayStart.setHours(0, 0, 0, 0);

          let count5min = 0,
            count30min = 0,
            count1hr = 0,
            countToday = 0;

          visitList.forEach((v) => {
            const ts = v.timestamp;
            if (ts >= fiveMinAgo) count5min++;
            if (ts >= thirtyMinAgo) count30min++;
            if (ts >= oneHrAgo) count1hr++;
            if (ts >= todayStart.getTime()) countToday++;
          });

          document.getElementById("stat5min").textContent = count5min;
          document.getElementById("stat30min").textContent = count30min;
          document.getElementById("stat1hr").textContent = count1hr;
          document.getElementById("statToday").textContent = countToday;
        });
      }

      // Real-time listener for live count
      db.ref("viewers").on("value", (snapshot) => {
        const count = snapshot.numChildren();
        countEl.textContent = count;
        timeEl.textContent = `Last updated: ${formatDateTime(new Date())}`;
      });

      // Initial load + auto refresh every 30 seconds
      updateStats();
      setInterval(updateStats, 30000);

      function refreshStats() {
        updateStats();
        showToast("Stats refreshed");
      }

      function resetData() {
        const confirmReset = confirm(
          "Are you sure you want to RESET all viewer and visit data? This cannot be undone.",
        );
        if (!confirmReset) return;

        db.ref("viewers").remove();
        db.ref("visits").remove();
        showToast("All data reset successfully");
      }
    </script>
  </body>
</html>
